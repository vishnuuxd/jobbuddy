<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call with Meera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff;text-decoration:none}a:hover{color:#e6ffa9}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b051d; font-family: Inter, system-ui, sans-serif; color: #ffffff; display: flex; flex-direction: column; padding: 60px 20px 32px; box-sizing: border-box">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 6px" role="img" aria-label="Question 2 of 3">
      <span style="width: 28px; height: 8px; border-radius: 4px; background: #e6ffa9"></span>
      <span style="width: 28px; height: 8px; border-radius: 4px; background: #aa89f2"></span>
      <span style="width: 28px; height: 8px; border-radius: 4px; background: #373544"></span>
    </div>
    <span style="padding: 6px 12px; border-radius: 999px; background: #2c2242; font-size: 14px; font-weight: 500">Question 2 of 3</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
    <div aria-hidden="true" style="position: relative; width: 230px; height: 230px">
      <div style="position: absolute; left: 6px; top: 16px; width: 214px; height: 208px; background: #aa89f2; border-radius: 48% 52% 46% 54% / 52% 44% 56% 48%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
        <div style="display: flex; gap: 40px">
          <span style="width: 18px; height: 30px; border-radius: 9px; background: #0b051d"></span>
          <span style="width: 18px; height: 30px; border-radius: 9px; background: #0b051d"></span>
        </div>
      </div>
      <span style="position: absolute; right: 6px; top: 4px; width: 40px; height: 40px; border-radius: 20px; background: #e6ffa9"></span>
      <span style="position: absolute; right: -14px; bottom: 26px; padding: 8px 14px; border-radius: 999px; background: #e6ffa9; color: #0b051d; font-size: 14px; font-weight: 700; rotate: -4deg">Nice, keep going</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <p style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 32px; line-height: 1.05">Meera's listening</p>
      <p style="margin: 0; font-size: 15px; color: #b3afc2">Take your time</p>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 16px; background: #ffffff; color: #0b051d; margin-bottom: 18px">
    <span style="font-size: 13px; font-weight: 700; color: #615f6d">Meera asked</span>
    <span style="font-size: 18px; font-weight: 500; line-height: 1.35">Tell me about a time a stakeholder pushed back on your design. How did it end?</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 10px">
      <button type="button" onClick="{{toggleMute}}" aria-pressed="{{muted}}" aria-label="Mute" style="{{muteStyle}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="button" aria-label="Camera" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #2c2242; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/></svg>
      </button>
    </div>
    <a href="Writing.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 28px; border-radius: 100px; background: #ffa8cd; color: #0b051d; font-size: 17px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b051d" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>End call
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { muted: false };
  }
  renderVals() {
    const muted = this.state.muted;
    return {
      muted,
      toggleMute: () => this.setState({ muted: !muted }),
      muteStyle: 'width: 56px; height: 56px; border-radius: 28px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; ' +
        (muted ? 'background: #ffffff; color: #0b051d;' : 'background: #2c2242; color: #ffffff;')
    };
  }
}
</script>
</body>
</html>
