<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b051d;text-decoration:none}a:hover{color:#2c2242}
button{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b051d; font-family: Inter, system-ui, sans-serif; color: #0b051d; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="display: flex; flex-direction: column; gap: 20px; padding: 12px 20px 32px; background: #f9f8f5; border-radius: 32px 32px 0 0">
    <div style="display: flex; justify-content: center"><span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: #e2e2e7"></span></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-family: 'Inter Tight', Inter, sans-serif; font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em">Let's get you interview ready</h1>
      <a href="Main.dc.html" aria-label="Close" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #ffffff; border: 1px solid #e2e2e7; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b051d" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 14px; font-weight: 700">I'm interviewing for</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 14px; font-weight: 700">At what level</p>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="4">
          <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="{{l.style}}">{{l.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 14px; font-weight: 700">How long</p>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{lengths}}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
            <span style="font-family: 'Inter Tight', Inter, sans-serif; font-weight: 700; font-size: 28px; line-height: 1">{{t.min}}</span>
            <span style="font-size: 13px">{{t.note}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 16px; background: #e6ffa9">
        <span style="font-size: 14px; font-weight: 700">Using your CV</span>
        <span style="font-size: 13px; color: #373544">vishnu-cv.pdf · Change</span>
      </div>
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: 16px; background: #ffffff; border: 1px dashed #75727f; color: #0b051d; cursor: pointer; text-align: left">
        <span style="font-size: 14px; font-weight: 700">+ Job post</span>
        <span style="font-size: 13px; color: #615f6d">Optional, paste it</span>
      </button>
    </div>

    <a href="Call.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 100px; background: #ffa8cd; color: #0b051d; font-size: 17px; font-weight: 700">Call Meera · {{lengthLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'Product designer', level: 'Senior', length: 10 };
  }
  chip(on) {
    return 'display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 100px; font-size: 15px; font-weight: 500; cursor: pointer; ' +
      (on ? 'background: #0b051d; color: #ffffff; border: 1px solid #0b051d;' : 'background: #ffffff; color: #0b051d; border: 1px solid #373544;');
  }
  renderVals() {
    const roles = ['Product designer', 'UX researcher', 'Product manager', 'Engineer', '+ Other'].map((label) => ({
      label, on: this.state.role === label, style: this.chip(this.state.role === label),
      pick: () => this.setState({ role: label })
    }));
    const levels = ['Junior', 'Mid', 'Senior', 'Lead'].map((label) => ({
      label, on: this.state.level === label,
      style: this.chip(this.state.level === label) + ' justify-content: center; padding: 0 4px;',
      pick: () => this.setState({ level: label })
    }));
    const lengths = [[5, 'min · quick'], [10, 'min · usual'], [20, 'min · full']].map(([min, note]) => {
      const on = this.state.length === min;
      return {
        min, note, on,
        style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; border-radius: 16px; cursor: pointer; text-align: left; color: #0b051d; ' +
          (on ? 'background: #aa89f2; border: 1px solid #aa89f2;' : 'background: #ffffff; border: 1px solid #e2e2e7;'),
        pick: () => this.setState({ length: min })
      };
    });
    return { roles, levels, lengths, lengthLabel: this.state.length + ' min' };
  }
}
</script>
</body>
</html>
